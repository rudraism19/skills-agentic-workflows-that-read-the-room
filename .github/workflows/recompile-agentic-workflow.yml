name: Recompile Agentic Workflow

on:
  push:
    branches:
      - fix/recompile-agentic-workflow

permissions:
  contents: write

jobs:
  recompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gh-aw
        run: gh extension install github/gh-aw

      - name: Compile workflow
        run: gh aw compile .github/workflows/update-github-info.md

      - name: Commit generated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .github/workflows/update-github-info.lock.yml; then
            echo "Lock file is already up to date."
            exit 0
          fi
          git add .github/workflows/update-github-info.lock.yml
          git commit -m "chore: recompile update-github-info workflow"
          git push
